name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcfinancial_test
          POSTGRES_USER: mcfinancial
          POSTGRES_PASSWORD: mcfinancial_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcfinancial -d mcfinancial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mcfinancial:mcfinancial_ci@127.0.0.1:5432/mcfinancial_test?schema=public
      TEST_DATABASE_URL: postgresql://mcfinancial:mcfinancial_ci@127.0.0.1:5432/mcfinancial_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations to a clean database
        run: npx prisma migrate deploy

      - name: Schema and migrations agree
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (React, TypeScript, import boundaries)
        run: npm run lint

      - name: Tests (unit, integration, authorization matrix; 100% coverage on the money path)
        run: npm run test:coverage

      # No high-severity advisory in any dependency: what ships, and the
      # build and test tools.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      # The weekly restore check (runbook Stage 1) against a real backup, so a
      # schema change that breaks it fails here and not on the club's server.
      - name: Backup and restore round trip
        env:
          ROUND_TRIP_URL: postgresql://mcfinancial:mcfinancial_ci@127.0.0.1:5432/mc_backup_ci
          ADMIN_SEED_PASSWORD: ci-only seed password
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client
          psql "postgresql://mcfinancial:mcfinancial_ci@127.0.0.1:5432/postgres" -qc 'CREATE DATABASE mc_backup_ci'
          DATABASE_URL="$ROUND_TRIP_URL?schema=public" npx prisma migrate deploy
          DATABASE_URL="$ROUND_TRIP_URL?schema=public" npx prisma db seed
          age-keygen -o "$RUNNER_TEMP/identity.txt"
          age-keygen -y "$RUNNER_TEMP/identity.txt" > "$RUNNER_TEMP/recipients.txt"
          BACKUP_LOCAL_ONLY=1 BACKUP_DATABASE_URL="$ROUND_TRIP_URL" BACKUP_AGE_RECIPIENTS_FILE="$RUNNER_TEMP/recipients.txt" \
            ./scripts/ops/backup-postgres.sh
          AGE_IDENTITY_FILE="$RUNNER_TEMP/identity.txt" RESTORE_ADMIN_URL="postgresql://mcfinancial:mcfinancial_ci@127.0.0.1:5432/postgres" \
            ./scripts/ops/restore-postgres.sh verify 2>&1 | tee "$RUNNER_TEMP/verify.log"
          grep -q PASS "$RUNNER_TEMP/verify.log"

  # Secret scanning: gitleaks over the whole history, so a password, key or
  # token committed anywhere (even later removed) fails the build. Accepted
  # test-only values are listed, with the reason, in .gitleaksignore.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Secret scan (every commit)
        run: gitleaks git . --redact --no-banner --verbose

  # Browser tests (Playwright, e2e/): the golden paths in a real browser
  # against a production build, each role signed in with password and
  # two-factor, on a database of its own.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcfinancial_e2e
          POSTGRES_USER: mcfinancial
          POSTGRES_PASSWORD: mcfinancial_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcfinancial -d mcfinancial_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mcfinancial:mcfinancial_ci@127.0.0.1:5432/mcfinancial_e2e?schema=public
      E2E_DATABASE_URL: postgresql://mcfinancial:mcfinancial_ci@127.0.0.1:5432/mcfinancial_e2e?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The production image (docs/operations/deploy-hetzner-postgres.md): it
  # builds, Prisma's engine loads, and the scripts run from inside it.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcfinancial
          POSTGRES_USER: mcfinancial
          POSTGRES_PASSWORD: mcfinancial_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcfinancial -d mcfinancial"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t mcfinancial-app .

      - name: Migrations, first admin and daily jobs inside the image
        run: |
          run() {
            docker run --rm --network host \
              -e DATABASE_URL=postgresql://mcfinancial:mcfinancial_ci@127.0.0.1:5432/mcfinancial?schema=public \
              "$@"
          }
          run mcfinancial-app npx prisma migrate deploy
          run -e ADMIN_EMAIL_TO_RESET=ci@example.test -e NEW_ADMIN_PASSWORD=ci-passphrase-123 mcfinancial-app npm run -s admin:reset-password
          run mcfinancial-app npm run -s dues:service
          run mcfinancial-app npm run -s loans:service
          # Static files reach the image (the logos are served from public/brand).
          run mcfinancial-app test -f public/brand/mc-logo.svg
          run mcfinancial-app test -f public/brand/mc-logo-on-dark.svg

      # The web server's configuration, and the public site (apps/web) as
      # Caddy serves it: pages, the not-found page, and sign-in going to the
      # member app.
      - name: Web server and public site
        run: |
          caddy() {
            docker run "$@" -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/apps/web/public:/srv/www:ro" \
              -e DOMAIN=http://admin.localhost -e APP_DOMAIN=app.example.test -e WWW_DOMAIN=http://www.localhost caddy:2
          }
          caddy --rm caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          caddy -d --name www -p 8088:80
          get() { curl -s --retry 10 --retry-connrefused --retry-delay 1 -o /dev/null -w "$2" -H 'Host: www.localhost' "http://127.0.0.1:8088$1"; }
          for page in / /about /membership /contact; do test "$(get "$page" '%{http_code}')" = 200 || { echo "$page"; exit 1; }; done
          test "$(get /no-such-page '%{http_code}')" = 404
          test "$(get /sign-in '%{redirect_url}')" = https://app.example.test/portal/login
          docker rm -f www
